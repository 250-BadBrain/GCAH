stages:
  - test

unit-test:
  stage: test
  image: node:26-bookworm
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.5.0 --activate
  script:
    - pnpm install --frozen-lockfile
    - pnpm verify
    - pnpm demo:mechanisms

image-build:
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_BUILDKIT: "1"
  script:
    - docker build --platform linux/amd64 --tag gcah:${CI_COMMIT_SHA} .
    - docker image inspect gcah:${CI_COMMIT_SHA} --format='{{json .RepoDigests}}' > image-digest.json
  artifacts:
    paths:
      - image-digest.json
